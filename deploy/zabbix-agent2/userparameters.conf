# Exemplo de UserParameter para Zabbix Agent 2 (Zabbix 7.0)
# Permite que o dashboard exiba pastas e programas que mais ocupam espaço por disco.
# Ajuste o Timeout no zabbix_agent2.conf (ex.: Timeout=30) e agende a coleta
# no template Zabbix para intervalos de 30m a 1h.

# --- Windows (coloque disk_top_usage.ps1 em C:\Program Files\Zabbix Agent 2\scripts\) ---
# UserParameter=custom.disk.top_usage,powershell -NoProfile -ExecutionPolicy Bypass -File "C:\Program Files\Zabbix Agent 2\scripts\disk_top_usage.ps1"

# --- Linux (coloque disk_top_usage.sh em /etc/zabbix/scripts/ com chmod +x) ---
# UserParameter=custom.disk.top_usage,/etc/zabbix/scripts/disk_top_usage.sh 10
