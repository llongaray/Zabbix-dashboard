# Include inside the HTTPS server for zabbix.avansat.com.br.
location = /zd/dashboard {
    return 308 /zd/dashboard/$is_args$args;
}

location ^~ /zd/dashboard/ {
    proxy_pass http://127.0.0.1:18084/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /zd/dashboard;
}

location ^~ /zd/dashboard/socket.io/ {
    proxy_pass http://127.0.0.1:18084/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /zd/dashboard;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 75s;
    proxy_buffering off;
}
