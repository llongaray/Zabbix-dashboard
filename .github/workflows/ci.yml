name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest ruff
      - name: Compile Python modules
        run: python -m compileall -q main.py app
      - name: Check critical Python mistakes
        run: ruff check --select E4,E7,E9,F --ignore E402 app tests main.py
      - name: Run Python tests
        run: pytest -q
      - name: Check JavaScript module syntax
        run: |
          for file in app/static/js/*.js; do
            node --input-type=module --check < "$file"
          done
