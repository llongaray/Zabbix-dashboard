<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c1125"><title>Entrar | Zabbix Dashboard</title><link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}"></head>
<body><div class="page"><header class="top"><div class="brand"><span class="logo" aria-hidden="true">◈</span><span>Zabbix Dashboard<small>INFRASTRUCTURE</small></span></div></header>
<main class="main"><section class="card" aria-labelledby="login-title"><div class="icon" aria-hidden="true">⌁</div><h1 id="login-title">Bem-vindo de volta</h1><p class="subtitle">Entre com sua senha administrativa para acessar o monitoramento da infraestrutura.</p>
{% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
<form method="post" action="{{ url_for('dashboard.login') }}"><div class="field"><label for="password">Senha administrativa</label><div class="password"><input id="password" name="password" type="password" placeholder="Digite sua senha" autocomplete="current-password" required autofocus minlength="1"><button type="button" id="toggle" aria-label="Mostrar senha" aria-pressed="false">◉</button></div></div><button class="submit" type="submit">Entrar no dashboard →</button></form><p class="note">Acesso restrito · Credenciais protegidas</p></section></main><footer class="footer">Zabbix Dashboard · Flask · PostgreSQL · Docker</footer></div><script>const t=document.querySelector('#toggle'),p=document.querySelector('#password');t.addEventListener('click',()=>{const show=p.type==='password';p.type=show?'text':'password';t.setAttribute('aria-pressed',String(show));t.setAttribute('aria-label',show?'Ocultar senha':'Mostrar senha')})</script></body></html>
