<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zabbix Dashboard</title><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>body{margin:0;font:15px system-ui;background:#0f172a;color:#e2e8f0}header{padding:18px 28px;background:#1e293b}main{padding:24px;max-width:1200px;margin:auto}.panel{background:#1e293b;padding:20px;border-radius:12px;margin:16px 0}button,input,select{padding:10px;margin:4px;border-radius:6px}button{cursor:pointer}.tabs{display:flex;flex-wrap:wrap}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #334155;text-align:left}canvas{max-height:360px}</style><header><strong>Zabbix Dashboard</strong> · Monitoramento e inventário <form action="/logout" method="post" style="float:right"><button>Sair</button></form></header><main><section class="panel"><h3>Configuração</h3><input id="url" placeholder="URL Zabbix"><input id="token" type="password" placeholder="API Token (deixe vazio para manter)"><button onclick="save()">Salvar</button><p id="status"></p></section><section class="panel"><h3>Servidores</h3><div id="tabs" class="tabs"></div></section><section class="panel"><h3>Itens e métricas</h3><select id="days"><option value="1">24 horas</option><option value="7">7 dias</option><option value="30">30 dias</option><option value="90">90 dias</option><option value="365">365 dias</option></select><table><thead><tr><th>Item</th><th>Valor</th><th>Histórico</th></tr></thead><tbody id="items"></tbody></table></section><section class="panel"><h3>Histórico</h3><canvas id="chart"></canvas></section></main><script>let graph;async function api(url,options){let r=await fetch(url,options);let data=await r.json();if(!r.ok)throw Error(data.error||r.status);return data}async function save(){try{await api('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({zabbix_url:document.querySelector('#url').value,zabbix_token:document.querySelector('#token').value})});document.querySelector('#status').textContent='Salvo';load()}catch(e){document.querySelector('#status').textContent=e.message}}async function load(){try{let cfg=await api('/api/config');document.querySelector('#url').value=cfg.zabbix_url;let hosts=await api('/api/hosts');let tabs=document.querySelector('#tabs');tabs.replaceChildren();hosts.forEach(h=>{let b=document.createElement('button');b.textContent=h.name||h.host;b.onclick=()=>show(h.hostid);tabs.append(b)});if(hosts.length)show(hosts[0].hostid)}catch(e){document.querySelector('#status').textContent=e.message}}async function show(id){try{let list=await api('/api/hosts/'+encodeURIComponent(id)+'/items');let tbody=document.querySelector('#items');tbody.replaceChildren();list.forEach(item=>{let row=document.createElement('tr');let name=document.createElement('td');name.textContent=item.name;let val=document.createElement('td');val.textContent=item.lastvalue+' '+item.units;let cell=document.createElement('td');let b=document.createElement('button');b.textContent='Ver gráfico';b.onclick=()=>plot(item);cell.append(b);row.append(name,val,cell);tbody.append(row)})}catch(e){alert(e.message)}}async function plot(item){try{let days=document.querySelector('#days').value;let data=await api('/api/history/'+encodeURIComponent(item.itemid)+'?days='+days+'&value_type='+item.value_type);let pts=data.points;if(graph)graph.destroy();graph=new Chart(document.querySelector('#chart'),{type:'line',data:{labels:pts.map(p=>new Date(Number(p.clock)*1000).toLocaleString('pt-BR')),datasets:[{label:item.name,data:pts.map(p=>Number(p.value_avg??p.value)),borderColor:'#38bdf8',pointRadius:0}]},options:{responsive:true}})}catch(e){alert(e.message)}}load()</script></html>
